name: .NET Build

# Split into two jobs to control GitHub Actions minute spend (2000/month limit):
# - build-and-unit-test runs on every push/PR against main - build + the fast tier only
#   (SteamEngine.Tests / SteamEngine.Tests.Fixtures namespaces: no real server processes,
#   seconds to run). This is what "did I break something" should cost on every push.
# - full-regression is manual only (workflow_dispatch, the Actions tab's "Run workflow"
#   button) - build + the ENTIRE suite, including the full-boot tier
#   (SteamEngine.Tests.Protocol: spawns real AuxiliaryServer/GameCore processes per test
#   class, ~9-11 minutes). Run this deliberately before/after something that could affect
#   protocol-level behavior, not automatically on every commit.
# `paths-ignore` (doc-only-paths below) skips the whole workflow for pushes/PRs that only
# touch *.md/docs/issue-template content - found 2026-10-17 that these were burning a full
# fast-tier run (restore+build+test) for zero code risk, a real contributor to the monthly
# Actions-minutes budget running low with ~14 days left. A push mixing doc and code changes
# still runs normally - this only skips when EVERY changed file matches.
on:
  push:
    branches: [main]
    paths-ignore: &doc-only-paths
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [main]
    paths-ignore: *doc-only-paths
  workflow_dispatch:
    inputs:
      tier:
        description: fast (build + fast tier) or full (entire suite)
        type: choice
        options: [fast, full]
        default: fast

# A newer push to the same PR or branch cancels the run still going for the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-unit-test:
    if: github.event_name != 'workflow_dispatch' || inputs.tier == 'fast'
    runs-on: ubuntu-latest
    timeout-minutes: 15 # #1185: two builds now, Debug and Release

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Single source of truth for "how to build this solution" - the same
      # script contributors run locally on Windows/macOS/Linux. It handles
      # restore, the 7 standalone-buildable projects, generating
      # scripts/Generated from .ct templates (GameCore's own boot sequence),
      # and the final full-solution build.
      - name: Build
        shell: pwsh
        run: ./build.ps1 -Configuration Debug
        working-directory: moriaengine

      # #1185: Release compiles too (as scripts/test-fast.sh), so its #if branches can't break unnoticed again.
      - name: Build (Release, compile only)
        shell: pwsh
        run: ./build.ps1 -Configuration Release
        working-directory: moriaengine

      # Fast tier only - excludes SteamEngine.Tests.Protocol (the full-boot tier, see
      # full-regression below). No real server processes spawned here, so no hang risk
      # worth a --blame-hang safety net the way the full suite needs one.
      - name: Test (fast tier)
        run: dotnet test moriaengine/Tests/SteamEngine.Tests.csproj --no-build -c Debug --filter "FullyQualifiedName!~SteamEngine.Tests.Protocol&FullyQualifiedName!~SteamEngine.Tests.Perf."

  full-regression:
    if: github.event_name == 'workflow_dispatch' && inputs.tier == 'full'
    runs-on: ubuntu-latest
    # Full suite normally takes ~9-11 minutes. Without this, a hung run (seen in practice -
    # one got stuck for 2.5+ hours after a test failure, presumably a deadlock during test/
    # fixture teardown) silently burns CI minutes for up to GitHub's 360-minute job default
    # instead of failing fast.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        shell: pwsh
        run: ./build.ps1 -Configuration Debug
        working-directory: moriaengine

      # --blame-hang catches a stuck individual test (killing just that test process and
      # dumping diagnostics) well before the job-level timeout-minutes above would have to
      # kill the whole run blind - 5 minutes is generous against the slowest real test classes
      # seen so far (~45s each).
      - name: Test (full suite)
        run: dotnet test moriaengine/Tests/SteamEngine.Tests.csproj --no-build -c Debug --blame-hang --blame-hang-timeout 5min
