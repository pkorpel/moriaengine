name: .NET Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Single source of truth for "how to build this solution" - the same
      # script contributors run locally on Windows/macOS/Linux. It handles
      # restore, the 7 standalone-buildable projects, generating
      # scripts/Generated from .ct templates (GameCore's own boot sequence),
      # and the final full-solution build.
      - name: Build
        shell: pwsh
        run: ./build.ps1 -Configuration Debug
        working-directory: moriaengine

      - name: Test
        run: dotnet test moriaengine/Tests/SteamEngine.Tests.csproj --no-build -c Debug
