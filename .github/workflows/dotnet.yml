name: .NET Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    # Full suite normally takes ~9-11 minutes. Without this, a hung run (seen in practice -
    # one got stuck for 2.5+ hours after a test failure, presumably a deadlock during test/
    # fixture teardown) silently burns CI minutes for up to GitHub's 360-minute job default
    # instead of failing fast.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Single source of truth for "how to build this solution" - the same
      # script contributors run locally on Windows/macOS/Linux. It handles
      # restore, the 7 standalone-buildable projects, generating
      # scripts/Generated from .ct templates (GameCore's own boot sequence),
      # and the final full-solution build.
      - name: Build
        shell: pwsh
        run: ./build.ps1 -Configuration Debug
        working-directory: moriaengine

      # --blame-hang catches a stuck individual test (killing just that test process and
      # dumping diagnostics) well before the job-level timeout-minutes above would have to
      # kill the whole run blind - 5 minutes is generous against the slowest real test classes
      # seen so far (~45s each).
      - name: Test
        run: dotnet test moriaengine/Tests/SteamEngine.Tests.csproj --no-build -c Debug --blame-hang --blame-hang-timeout 5min
